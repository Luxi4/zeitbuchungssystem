<!DOCTYPE html>
<html lang="de">
{% load static %}
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Social-Media-Projekt </title>
        <link rel="icon" 
            type="image/x-icon" 
            href="{% static 'teemLogo.png' %}";>
        <link rel="stylesheet" href="{% static 'design.css' %}">
    </head>

    <body>
        
        
        <article>
        <div class="blackbox">

            <h2>Login</h2>
            <video width="100%" height="50" autoplay loop muted>
        <source src="{% static 'pacman_gif.mp4' %}" type="video/mp4">
    </video>
<form method="post">
  {% csrf_token %}
  <label>Email: <input type="email" name="email" required></label><br>
  <label>Passwort: <input type="password" name="passwort" required></label><br><br>
  <button type="submit">Einloggen</button>
</form>

{% if hinweis %}
  <p style="color: red;">{{ hinweis }}</p>
{% endif %}
</div>
<div class="blackbox">
    <p>Du hast noch kein Konto? <a href="{% url 'registrieren' %}"><button type="button">Registrierung</button></a>
</div>
        </article>

        
    </body>

</html>

<html lang="de">

        <link rel="icon" 
            type="image/x-icon" 
            href="{% static 'teemLogo.png' %}";>
        <link rel="stylesheet" href="{% static 'design.css' %}">

        <style>
      #id_address, #id_title, #id_description, #id_date {
          height: 16px;
      }
  </style>

  </style>
<!-- map -->
<script src='https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js'></script>
<link href='https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css' rel='stylesheet' />
<!-- map -->
    </head>
    <body>
        <p style="color:white";> ® All rights reserved by LILA productions</p>
        <header> 
            <img src="{% static 'teemLogo.png' %}";
                height="150px"; width="300px;">
        </header>
        <nav class="navbar">
            <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'my_account' %}">My Account</a></li>
            <li><a href="{% url 'my_events' %}">Neue Events</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            </ul>
        </nav>

        <article>
            <div class="blackbox" >
                <h1> Sieh dir tolle Events in Hochschulnähe an!</h1>
<!-- Map -->
    <div id='map' style='width: 100%; height: 300px;'></div>
<script>
mapboxgl.accessToken = 'pk.eyJ1IjoidGVlbTEiLCJhIjoiY21jOW00eWgyMDQ1cjJzc2x2NnloZDI4MiJ9.RsKX8bG-FaDg7loiIJ5wgg';
const map = new mapboxgl.Map({
	container: 'map', // container ID
	style: 'mapbox://styles/mapbox/streets-v12', // style URL
	center: [9.183007, 48.908129], // starting position [lng, lat]
	zoom: 9, // starting zoom
});

// Create a new marker.
{% for address in addresses %}
var marker = new mapboxgl.Marker()
    .setLngLat([{{ address.long }}, {{ address.lat }}])
    .setPopup(new mapboxgl.Popup().setHTML("<p style='color: black'>{{ address.title }}<br>{{ address.date }}<br>{{ address.address }}<br>{{ address.description }}</p>"))
    .addTo(map);
{% endfor %}
</script>
<br>
    <h1>Neue Events!</h1>
            <p>Erstelle hier deine neuen Events! Sie werden auf der Map angezeigt :)</p>
<form method="post">
            {% csrf_token %}
            {{ form }}
            <br>
            <input type="submit" value="Event Erstellen">
        </form>
</div>
<!-- Map -->
        </article>

    </body>

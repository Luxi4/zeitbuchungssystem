<!DOCTYPE html>
<html lang="de">
{% load static %}
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Social-Media-Projekt </title>
        <link rel="icon" 
            type="image/x-icon" 
            href="{% static 'teemLogo.png' %}";>
        <link rel="stylesheet" href="{% static 'design.css' %}">
    </head>

    <body>
        
        
        <article>
        <div class="blackbox">
        
            <h2>Registrierung</h2>
            <video width="100%" height="50" autoplay loop muted>
        <source src="{% static 'pacman_gif.mp4' %}" type="video/mp4">
    </video>
    <form method="post">
      {% csrf_token %}
      <label>Benutzername:</label><br>
      <input type="text" name="nutzername" required><br><br>
    
      <label>E-Mail:</label><br>
      <input type="email" name="email" required><br><br>
    
      <label>Passwort:</label><br>
      <input type="password" name="passwort" required><br><br>
    
      <button type="submit">Registrieren</button>
    </form>
    </div>
    <div class="blackbox">
    <p>Du hast schon ein Konto? <a href="{% url 'login' %}"><button type="button">Zum Login</button></a>
</div>

</div>
        </article>

        
    </body>

</html>
